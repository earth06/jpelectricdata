<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - JP Electric Dashboard</title>
    <link rel="icon" href="{{ url_for('static', path='/images/power_demand_favicon.ico') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', path='/images/power_demand_favicon_256.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    {% block extra_head %}{% endblock %}
    <script defer src="/static/vendor/plotly/plotly.min.js"></script>
    <script defer src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script defer src="{{ url_for('static', path='/js/charts.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </head>
  <body data-page="{{ page }}">
    <div class="app-shell">
      <nav id="sidebar" class="sidebar">
        <div class="brand">
          <span class="brand-kicker">JP Electric Data</span>
          <span class="brand-title">電力需給ダッシュボード</span>
        </div>
        <div class="nav-list">
          {% for item in navigation %}
            <a class="nav-link{% if request.url.path == item.path %} active{% endif %}" href="{{ item.path }}">
              <span class="nav-icon" data-icon="{{ item.icon }}"></span>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          {% endfor %}
        </div>
      </nav>
      <div class="content-wrapper">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="サイドバーを開閉">
            <span id="sidebar-toggle-icon">‹</span>
          </button>
          <div>
            <h1>電力需給・電力市場ダッシュボード</h1>
            <p>電力需給と市場価格データの可視化</p>
          </div>
          <div class="topbar-status">
            <span class="bolt"></span>
            <span>最新データを確認</span>
          </div>
        </header>
        <main class="main-content">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
