{% extends "base.html" %}

{% block content %}
<section class="page-heading">
  <span>需給バランス</span>
  <h2>各エリアの需給構造と市場価格</h2>
  <p>スポット市場価格とエリア別需給構成を並べて比較し、変化の兆しを素早く捉えます。</p>
</section>

<section class="dashboard-grid">
  <aside class="panel settings-panel">
    <h3>ビュー設定</h3>
    <p>比較したい期間とエリアを選択します。</p>
    <label for="balance-base-date">推論実行日</label>
    <input id="balance-base-date" type="date" min="2024-04-01" value="{{ chart_base_date }}">
    <label for="balance-area">需給バランス対象エリア</label>
    <select id="balance-area">
      {% for value, label in area_options.items() %}
        <option value="{{ value }}" {% if value == "chubu" %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </aside>
  <div class="chart-stack">
    <article class="panel chart-panel">
      <div class="panel-header">
        <h3>スポット市場価格</h3>
        <span>単位: 円/kWh</span>
      </div>
      <div id="balance-price-chart" class="chart"></div>
    </article>
    <article class="panel chart-panel">
      <div class="panel-header">
        <h3>需給実績の積み上げ</h3>
        <span>単位: 万kWh</span>
      </div>
      <div id="balance-supply-chart" class="chart tall-chart"></div>
    </article>
  </div>
</section>
{% endblock %}
